[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
; Player, 2026-10-26: Lumen looked great (-EXUltra), so it is the default now: Lumen global illumination and reflections,
; virtual shadow maps. -EXLow (Jogar Leve.bat) turns them off for more fps.
r.Shadow.Virtual.Enable=1
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=0
; Enough shadow pages for the whole canyon (the page-pool overflow warning was one of the red lines on screen).
r.Shadow.Virtual.MaxPhysicalPages=4096
; Higher quality (2026-10-25), still without Lumen: temporal super resolution, sharper shadows, ambient occlusion, screen-space reflections.
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=100
r.Shadow.MaxResolution=4096
r.Shadow.MaxCSMResolution=4096
r.Shadow.CSM.MaxCascades=4
r.Shadow.DistanceScale=1.5
r.AmbientOcclusionLevels=3
r.AmbientOcclusionStaticFraction=0
r.SSR.Quality=3
r.Tonemapper.Sharpen=0.4
r.BloomQuality=5
r.Streaming.PoolSize=2000
; Cinematic air and light (2026-10-26)
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=64
r.Shadow.RadiusThreshold=0.015
r.ContactShadows=1
r.MotionBlurQuality=3
r.DepthOfFieldQuality=2

